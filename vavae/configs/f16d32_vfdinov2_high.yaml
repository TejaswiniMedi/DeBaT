ckpt_path: /path/to/ckpt # used for testing only, add your ckpt path if you want to test the model
# weight_init: /path/to/weight_init # if you want to finetune va-vae on your own dataset, add your weight_init path

model:
  base_learning_rate: 1.0e-04
  target: ldm.models.autoencoder.AutoencoderKL
  params:
    monitor: val/rec_loss
    embed_dim: 32
    input_mode: 2 # high frequency: Haar (LH, HL, HH) / 2 -> [B, 9, 128, 128]
    # DINOv2 alignment and LPIPS need RGB, so both are off for the 9-channel HF input.
    # --------------------------------------------------
    use_vf: null
    reverse_proj: true
    # --------------------------------------------------
    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 5001
        kl_weight: 1.0e-06
        disc_weight: 0.5
        disc_in_channels: 9
        perceptual_weight: 0.0
        # hyper-param for vision foundation model alignment (unused with use_vf: null)
        # --------------------------------------------------
        vf_weight: 0.1
        adaptive_vf: true
        distmat_margin: 0.25
        cos_margin: 0.5
        # --------------------------------------------------
    ddconfig:
      double_z: true
      z_channels: 32
      resolution: 128
      in_channels: 9
      out_ch: 9
      ch: 128
      ch_mult: # 4 levels: 128 / 8 = 16x16 latent, same grid as the low branch
      - 1
      - 1
      - 2
      - 2
      num_res_blocks: 2
      attn_resolutions:
      - 16
      dropout: 0.0
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 8 # batch size per GPU
    wrap: true
    train:
      target: ldm.data.imagenet.ImageNetTrain
      params:
        data_root: /ceph/mfatima/ImageNet/
    validation:
      target: ldm.data.imagenet.ImageNetValidation
      params:
        data_root: /ceph/mfatima/ImageNet/

lightning:
  trainer:
    # main.py ignores devices/num_nodes here: it uses every visible GPU and --num_nodes.
    strategy: ddp # PL 1.9.5: plain ddp already uses find_unused_parameters=True (the _true name is PL 2.x only)
    accelerator: gpu
    max_epochs: 50
    precision: 32


