ckpt_path: logs/f16d32_vfdinov2_high_images/checkpoints/last-v2.ckpt # used for testing only, add your ckpt path if you want to test the model
# weight_init: /path/to/weight_init # if you want to finetune va-vae on your own dataset, add your weight_init path

model:
  base_learning_rate: 1.0e-04
  target: ldm.models.autoencoder.AutoencoderKL
  params:
    monitor: val/rec_loss
    embed_dim: 32
    input_mode: 2 # high frequency components,
    # hyper-param for vision foundation model alignment
    # --------------------------------------------------
    use_vf: null
    reverse_proj: true        # default: true, project from vae dim --> dinov2 dim
    # --------------------------------------------------
    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 5001
        kl_weight: 1.0e-06
        disc_weight: 0.5
        disc_in_channels: 3
        perceptual_weight: 0.0
        # hyper-param for vision foundation model alignment
        # --------------------------------------------------
        vf_weight: 0.1
        adaptive_vf: true
        distmat_margin: 0.25
        cos_margin: 0.5
        # --------------------------------------------------
    ddconfig:
      double_z: true
      z_channels: 32
      resolution: 256    #128
      in_channels: 9
      out_ch: 3
      ch:  128 #128
      ch_mult:
      - 1
      - 1   # extra_I_added!
      - 2
      - 2
      - 4
      num_res_blocks: 2
      attn_resolutions:
      - 16
      dropout: 0.0
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 32  #96 # batch size per GPU
    wrap: true
    train:
      target: ldm.data.imagenet.ImageNetTrain
      params:
        data_root: /ceph/mfatima/ImageNet/
    validation:
      target: ldm.data.imagenet.ImageNetValidation
      params:
        data_root: /ceph/mfatima/ImageNet/

lightning:
  trainer:
    strategy: ddp
    accelerator: gpu
    max_epochs: 50
    precision: 32